name: Industry benchmark advisor tests

on:
  pull_request:
    paths:
      - "industry_benchmark.py"
      - "pages/industry_benchmark_advisor.py"
      - "tests/test_industry_benchmark.py"
      - ".github/workflows/industry-advisor-tests.yml"
  push:
    branches:
      - "codex/industry-benchmark-advisor-20261106"
    paths:
      - "industry_benchmark.py"
      - "pages/industry_benchmark_advisor.py"
      - "tests/test_industry_benchmark.py"
      - ".github/workflows/industry-advisor-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run advisor unit tests
        run: python -m unittest tests/test_industry_benchmark.py tests/test_edinet_registry.py -v
